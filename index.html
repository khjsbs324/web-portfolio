<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="디자이너 김혜지의 프로필과 학력, 활동, 기술을 소개합니다.">
  <title>김혜지 | 디자이너 프로필</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/jquery-3.7.1.min.js" defer></script>
  <script src="vendor/gsap-3.13.0.min.js" defer></script>
  <script src="vendor/ScrollTrigger-3.13.0.min.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <main class="portfolio">
    <section class="hero" aria-label="포트폴리오 인트로">
      <div class="hero-art" data-node-id="761:512">
        <img
          src="https://cdn.jsdelivr.net/gh/khjsbs324/UIUXB_2610@main/2%ED%94%84%EB%A1%9C%ED%95%84/image/backimg1.png"
          alt="따뜻한 베이지 배경에 주황빛 꽃이 핀 나뭇가지"
          width="1687" height="950" fetchpriority="high">
      </div>
    </section>

    <section class="profile" aria-labelledby="profile-headline" data-node-id="761:513">
      <div class="profile-inner">
        <aside class="profile-person" data-slide="left">
          <div class="portrait" data-node-id="761:515">
            <img
              src="https://raw.githubusercontent.com/khjsbs324/UIUXB_2610/main/2%ED%94%84%EB%A1%9C%ED%95%84/image/khj.jpg"
              alt="디자이너 김혜지의 프로필 사진"
              width="337" height="433">
          </div>
          <div class="contact">
            <h2 class="section-title name">
              <span>김혜지</span><span lang="en">KIM HYE JI</span>
            </h2>
            <dl class="contact-list">
              <div><dt>Birth</dt><dd>0000-00-00</dd></div>
              <div><dt>Phone.</dt><dd>010-0000-0000</dd></div>
              <div><dt>E-mail.</dt><dd>00000@000.com</dd></div>
            </dl>
          </div>
        </aside>

        <div class="profile-copy" data-slide="right">
          <h1 id="profile-headline" class="headline" data-node-id="761:580">
            <span>나를 표현하는 한 문장</span>
            <span>디자이너 김혜지 입니다</span>
          </h1>
          <div class="details-grid">
            <section class="detail education" aria-labelledby="education-title">
              <h2 id="education-title" class="section-title" lang="en">Education</h2>
              <ul class="bullet-list">
                <li>ooo 대학교 졸업</li>
                <li>ooo 고등학교 졸업</li>
                <li>AI기반 UIUX 웹디자인 &amp; 웹퍼블리셔 양성과정 수료</li>
              </ul>
            </section>
            <section class="detail activities" aria-labelledby="activities-title">
              <h2 id="activities-title" class="section-title" lang="en">Activities</h2>
              <ul class="bullet-list"><li>[활동 / 프로젝트]</li></ul>
            </section>
            <section class="detail skills" aria-labelledby="skills-title">
              <h2 id="skills-title" class="section-title" lang="en">Skill</h2>
              <ul class="skill-list" lang="en">
                <li>Figma</li><li>HTML5</li><li>CSS</li>
              </ul>
            </section>
            <section class="detail license" aria-labelledby="license-title">
              <h2 id="license-title" class="section-title" lang="en">License</h2>
              <ul class="bullet-list"><li>[자격증명]</li><li>[자격증명]</li></ul>
            </section>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
